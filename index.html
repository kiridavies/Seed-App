<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Seed App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f1;
      margin: 0;
      padding: 0;
      color: #253126;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #667066;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 16px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #31572c;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🌱 My Seed Collection</h1>
    <p class="subtitle">Seed inventory and sowing tracker</p>

    <div class="card">
      <h2>📦 My Seeds</h2>
      <p>View everything currently in your seed collection.</p>
      <button>View Seeds</button>
    </div>

    <div class="card">
      <h2>🌱 Sow This Month</h2>
      <p>See which seeds in your collection can be sown now.</p>
      <button>What Can I Sow?</button>
    </div>

    <div class="card">
      <h2>🪴 Growing Now</h2>
      <p>Track what you've already sown and how it's progressing.</p>
      <button>View Growing</button>
    </div>

  </div>

</body>
</html>
